<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grocery Shop</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>

<section class="register-section">
    <div class="register-container">
        <h2>Create Your Account</h2>
        <p>Join Grocery Shop and start shopping with ease!</p>

        <form onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="name"><i class='bx bxs-user'></i> Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email"><i class='bx bxs-envelope'></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone"><i class='bx bxs-phone'></i> Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="password"><i class='bx bxs-lock'></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class='bx bxs-lock-alt'></i> Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="btn">Register</button>

            <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
</section>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if(password !== confirm){
        alert("Passwords do not match!");
        return;
    }
    alert("Registration successful!");
    // You can add code here to save user data in localStorage or send to backend
    // Example: localStorage.setItem('loggedUser', JSON.stringify({name: ..., email: ...}));
});
</script>

<script src="auth.js"></script>

</body>
</html>
